name: 📚 Deploy Storybook to Vercel

on:
  push:
    branches:
      - develop

jobs:
  deploy-storybook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.STORYBOOK_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.STORYBOOK_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STORYBOOK_VERCEL_PROJECT_ID }}

      - name: Build project artifacts for Vercel
        run: vercel build --prod --token=${{ secrets.STORYBOOK_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.STORYBOOK_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STORYBOOK_VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.STORYBOOK_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.STORYBOOK_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STORYBOOK_VERCEL_PROJECT_ID }}
