name: ✨ Code Quality
on:
  push:
    branches:
      - develop
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint (fail on warnings)
        run: yarn lint

      - name: Run Prettier (check formatting)
        run: yarn format:check

      - name: Run TypeScript (check types)
        run: yarn typecheck
